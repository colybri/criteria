name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / DBAL ${{ matrix.dbal }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        dbal: ['^3.6', '^4.0']
        deps: [highest]
        include:
          - php: '8.1'
            dbal: '^3.6'
            deps: lowest
          - php: '8.1'
            dbal: '^4.0'
            deps: lowest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Pin doctrine/dbal
        run: composer require --no-update --no-interaction "doctrine/dbal:${{ matrix.dbal }}"

      - name: Install dependencies
        run: composer update --no-interaction --no-progress ${{ matrix.deps == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Show installed DBAL
        run: composer show doctrine/dbal | grep versions

      - name: Run tests
        run: vendor/bin/phpunit
